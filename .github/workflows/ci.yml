name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Touchline.sln
      - run: dotnet build Touchline.sln --no-restore --configuration Release
      - name: Test (database tests required)
        run: dotnet test Touchline.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory test-results
        env:
          # Postgres tests run in a Testcontainers container; fail rather than skip without Docker.
          TOUCHLINE_REQUIRE_DB_TESTS: "true"

      - name: Record the result against the API revision
        if: always()
        run: |
          echo "API revision: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Test results: test-results/results.trx (artifact)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: test-results

      - name: Dependency vulnerability check
        run: |
          dotnet list Touchline.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "Vulnerable packages found"; exit 1
          fi

  docker:
    # Builds the image Railway deploys, so a broken Dockerfile or .dockerignore fails the PR instead of the deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --tag touchline-api:ci .
      - name: The image starts in Production and answers /api/v1/health/live with no database
        run: |
          # Placeholder settings that pass startup validation; nothing real. The database is unreachable on purpose:
          # liveness must still be 200 and /api/v1/health 503.
          docker run -d --name api -p 8080:8080             -e ConnectionStrings__Touchline="Host=127.0.0.1;Port=1;Database=none;Username=app_api_user;Password=placeholder;SSL Mode=Require"             -e Supabase__Url=https://example.supabase.co             -e Cors__AllowedOrigins__0=https://app.example.com             touchline-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health/live; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/health)" = "503"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--since=2026-11-23"
